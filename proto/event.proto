syntax = "proto3";

package campus.events.v1;

service EventService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc GetEvent(EventId) returns (Event);
  rpc ReleaseSeat(EventId) returns (Empty);
  rpc EditEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc ReserveSeat(EventId) returns (Empty);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
}

message ListEventsRequest {
    optional string name_querry = 1;
}

message EventId {
    int64 event_id = 1;
}

message Event {
    int64 event_id = 1;
    string name = 2;
    int32 capacity = 3;
    int32 available_seats = 4;
}

message Empty {}
message UpdateEventRequest {int64 event_id = 1; optional string name = 2; optional int32 capacity = 3;}
message UpdateEventResponse {Event event = 1;}

message CreateEventRequest {string name = 1; int32 capacity = 2;}
message CreateEventResponse {Event event = 1;}

message ListEventsResponse {
    repeated Event events = 1;
}
